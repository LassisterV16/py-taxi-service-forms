{% extends "base.html" %}
{% block content %}
  <h1>Delete Manufacturer</h1>
  <p>Are you sure you want to delete manufacturer: {{ manufacturer.name }}?</p>
  <p>All cars of this manufacturer will be also deleted! </p>
  <form action="" method="post">
    {% csrf_token %}
    <input class="btn btn-primary" type="submit" value="Yes, delete">
    <a href="{% url 'taxi:manufacturer-list' %}">Cancel</a>
  </form>
{% endblock %}
